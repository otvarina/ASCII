<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII-арт</title>
<style>
  /* ───── ВСЕГО ДВА ЦВЕТА ───── */
  :root{
    --bg: #0b0b0b;   /* цвет 1 — фон */
    --fg: #f2f2f2;   /* цвет 2 — всё остальное */
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace, "SF Mono", Consolas, monospace;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    padding:14px 18px; border-bottom:1px solid var(--fg);
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  header b{ letter-spacing:.25em; font-size:15px; }
  header span{ opacity:.55; font-size:12px; }

  main{ flex:1; display:flex; min-height:0; }
  @media (max-width:820px){ main{ flex-direction:column; } }

  /* ───── ПАНЕЛЬ УПРАВЛЕНИЯ ───── */
  aside{
    width:280px; flex:none; padding:16px 18px 40px;
    border-right:1px solid var(--fg); overflow-y:auto;
  }
  @media (max-width:820px){
    aside{ width:100%; border-right:none; border-bottom:1px solid var(--fg); }
  }
  .group{ margin-bottom:20px; }
  .group > label{ display:block; font-size:11px; letter-spacing:.14em; opacity:.6; margin-bottom:7px; }

  input[type=range]{
    width:100%; -webkit-appearance:none; appearance:none; background:transparent; height:18px; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{ height:1px; background:var(--fg); }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; margin-top:-6px;
    background:var(--bg); border:1px solid var(--fg); border-radius:50%;
  }
  input[type=range]::-moz-range-track{ height:1px; background:var(--fg); }
  input[type=range]::-moz-range-thumb{
    width:11px; height:11px; background:var(--bg); border:1px solid var(--fg); border-radius:50%;
  }
  .val{ float:right; opacity:.6; font-size:11px; }

  select, input[type=text]{
    width:100%; background:var(--bg); color:var(--fg);
    border:1px solid var(--fg); padding:7px 8px; font:inherit; font-size:12px; outline:none;
  }
  input[type=text]{ margin-top:6px; }
  select:focus, input:focus{ background:var(--fg); color:var(--bg); }

  .check{ display:flex; align-items:center; gap:9px; cursor:pointer; font-size:12px; user-select:none; }
  /* галочка всегда видна: рамка + заливка внутри */
  input[type=checkbox]::after{
    content:""; position:absolute; inset:2px; background:var(--fg);
    opacity:0; transition:opacity .1s;
  }
  input[type=checkbox]:checked::after{ opacity:1; }
  input[type=checkbox]{
    appearance:none; -webkit-appearance:none; width:14px; height:14px; flex:none;
    border:1px solid var(--fg); background:var(--bg); cursor:pointer; position:relative;
  }

  button{
    width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--fg);
    padding:10px; font:inherit; font-size:12px; letter-spacing:.1em; cursor:pointer;
    transition:background .12s, color .12s;
  }
  button:hover{ background:var(--fg); color:var(--bg); }
  button:disabled{ opacity:.28; cursor:default; }
  button:disabled:hover{ background:var(--bg); color:var(--fg); }
  .btn-row{ display:flex; flex-direction:column; gap:8px; }

  /* ───── ВЫБОР ЦВЕТОВ ───── */
  .colorrow{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
  .colorrow span{ font-size:11px; opacity:.6; flex:1; }
  input[type=color]{
    appearance:none; -webkit-appearance:none; width:40px; height:22px; flex:none;
    border:1px solid var(--fg); background:none; padding:0; cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{ padding:0; }
  input[type=color]::-webkit-color-swatch{ border:none; }
  input[type=color]::-moz-color-swatch{ border:none; }

  /* ───── РАБОЧАЯ ЗОНА ───── */
  section{ flex:1; display:flex; align-items:center; justify-content:center; padding:18px; min-height:0; }
  .frame{ position:relative; max-width:100%; max-height:100%; border:1px solid var(--fg); }
  canvas{ display:block; max-width:100%; max-height:calc(100vh - 140px); background:var(--bg); }
  .empty{
    padding:60px 30px; text-align:center; opacity:.5; font-size:12px; letter-spacing:.1em;
  }
  video{ display:none; }
  .hint{ margin-top:9px; font-size:11px; opacity:.5; text-align:center; }
  a{ color:#fff; font-size:11px; letter-spacing:.12em; text-decoration:none; border-bottom:1px solid #fff; padding-bottom:2px; }
  a:hover{ opacity:.6; }
</style>
</head>
<body>

<header>
  <b>ASCII-АРТ</b>
</header>

<main>

  <aside>
    <div class="group">
      <label>1 · ФАЙЛ</label>
      <button id="pick">ЗАГРУЗИТЬ ФОТО ИЛИ ВИДЕО</button>
      <input type="file" id="file" accept="image/*,video/*" hidden>
      <div class="hint" id="fileHint">ничего не загружается в интернет</div>
    </div>

    <div class="group">
      <label>2 · ИЗ КАКИХ СИМВОЛОВ</label>
      <select id="preset">
        <option value="@%#*+=-:. ">ASCII</option>
        <option value="█▓▒░ ">Плотность</option>
        <option value="0123456789">Только цифры</option>
        <option value="абвгдеёжзийклмнопрстуфхцчшщъыьэюя">Только буквы (рус)</option>
        <option value="абвгдеёжзийклмнопрстуфхцчшщъыьэюя">Только буквы (англ)</option>
        <option value="custom">Свои символы</option>
      </select>
      <input type="text" id="custom" placeholder="напр.:  Ж#8.x_" hidden>
    </div>

    <div class="group">
      <label>3 · РАЗМЕР СИМВОЛА <span class="val" id="vSize"></span></label>
      <input type="range" id="size" min="6" max="34" value="14">
    </div>

    <div class="group">
      <label>ЯРКОСТЬ <span class="val" id="vBright"></span></label>
      <input type="range" id="bright" min="-100" max="100" value="0">
    </div>

    <div class="group">
      <label>КОНТРАСТ <span class="val" id="vContrast"></span></label>
      <input type="range" id="contrast" min="-100" max="100" value="0">
    </div>

    <div class="group">
      <label>4 · ЦВЕТ</label>
      <select id="mode">
        <option value="1">Один цвет</option>
        <option value="2">Два цвета</option>
        <option value="3">Три цвета</option>
        <option value="src">Как в исходнике</option>
      </select>

      <div>
        <div class="colorrow"><span>ЦВЕТ 1</span><input type="color" id="c1" value="#f2f2f2"></div>
        <div class="colorrow" id="row2" hidden><span>ЦВЕТ 2</span><input type="color" id="c2" value="#e0526a"></div>
        <div class="colorrow" id="row3" hidden><span>ЦВЕТ 3</span><input type="color" id="c3" value="#4a9de0"></div>
        <div class="colorrow" style="margin-top:12px"><span>ФОН</span><input type="color" id="cbg" value="#0b0b0b"></div>
      </div>
    </div>

    <div class="group">
      <label>5 · ПОВРЕЖДЕНИЯ</label>
      <label class="check" style="margin-bottom:16px">
        <input type="checkbox" id="invert"> ИНВЕРСИЯ
      </label>
      <label>ШУМ <span class="val" id="vNoise"></span></label>
      <input type="range" id="noise" min="0" max="100" value="0">
      <label style="margin-top:10px">ГЛИТЧ <span class="val" id="vGlitch"></span></label>
      <input type="range" id="glitch" min="0" max="100" value="0">
      <label style="margin-top:10px">ПОМЕХИ <span class="val" id="vInter"></span></label>
      <input type="range" id="inter" min="0" max="100" value="0">
    </div>

    <div class="group">
      <label>6 · СКАЧАТЬ</label>
      <div class="btn-row">
        <button id="dlPng">КАРТИНКА.PNG</button>
        <button id="dlTxt">ТЕКСТ.TXT</button>
        <button id="dlVid">ВИДЕО (без звука)</button>
      </div>
      <div class="hint" id="vidHint"></div>
    </div>

    <div class="group" style="margin-top:26px">
      <a id="author" href="https://t.me/navarotvar" target="_blank" rel="noopener">автор: otvar</a>
    </div>
  </aside>

  <section>
    <div class="frame">
      <canvas id="out" width="900" height="520"></canvas>
      <div class="empty" id="empty">ЗАГРУЗИТЕ ФОТО ИЛИ ВИДЕО →</div>
    </div>
  </section>

</main>

<video id="vid" muted playsinline></video>

<script>
(() => {
  "use strict";
  let BG = "#0b0b0b", FG = "#f2f2f2";

  const $ = id => document.getElementById(id);
  const out = $("out"), ctx = out.getContext("2d");
  const vid = $("vid");

  // маленький служебный холст: сюда ужимается исходник
  const off = document.createElement("canvas");
  const offCtx = off.getContext("2d", { willReadFrequently: true });

  let source = null;           // { w, h, isVideo }
  let img = null;              // загруженная картинка
  let grid = [];               // последний кадр в виде символов (для .txt)

  // ── настройки из интерфейса ──
  const S = () => ({
    chars   : getChars(),
    size    : +$("size").value,
    bright  : +$("bright").value,
    contrast: +$("contrast").value,
    mode    : $("mode").value,
    invert  : $("invert").checked,
    noise   : +$("noise").value,
    glitch  : +$("glitch").value,
    inter   : +$("inter").value
  });

  // ── цвет ──
  const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];

  function palette(){
    const mode = $("mode").value;
    if (mode === "src") return null;
    const stops = [hex2rgb($("c1").value)];
    if (+mode >= 2) stops.push(hex2rgb($("c2").value));
    if (+mode >= 3) stops.push(hex2rgb($("c3").value));
    return stops;
  }

  // яркость 0..1 → плавный переход между цветами
  function mix(stops, L){
    if (stops.length === 1) return `rgb(${stops[0]})`;
    const seg = 1 / (stops.length - 1);
    let i = Math.min(stops.length - 2, Math.floor(L / seg));
    const t = Math.min(1, Math.max(0, (L - i * seg) / seg));
    const a = stops[i], b = stops[i + 1];
    return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
  }

  // интерфейс остаётся тёмным всегда — меняется только фон картинки
  function syncTheme(){
    BG = $("cbg").value;
    FG = "#f2f2f2";
  }

  // показывать столько цветов, сколько выбрано
  function syncRows(){
    const n = $("mode").value === "src" ? 0 : +$("mode").value;
    $("row2").hidden = n < 2;
    $("row3").hidden = n < 3;
  }

  $("mode").addEventListener("change", () => { syncRows(); syncTheme(); });
  for (const id of ["c1","c2","c3","cbg"]) $(id).addEventListener("input", syncTheme);

  function getChars(){
    const p = $("preset").value;
    let c = p === "custom" ? $("custom").value : p;
    c = [...c];                       // разбить на отдельные символы
    if (c.length < 2) c = [..."@%#*+=-:. "];
    return c;
  }

  // ── подписи значений у ползунков ──
  const pairs = [["size","vSize"],["bright","vBright"],["contrast","vContrast"],
                 ["noise","vNoise"],["glitch","vGlitch"],["inter","vInter"]];
  function syncLabels(){
    for (const [a,b] of pairs) $(b).textContent = $(a).value;
  }
  for (const [a] of pairs) $(a).addEventListener("input", () => { syncLabels(); });

  // ── выбор символов ──
  $("preset").addEventListener("change", () => {
    const custom = $("preset").value === "custom";
    $("custom").hidden = !custom;
    if (custom && !$("custom").value) $("custom").value = "@#8x._";
  });
  $("custom").addEventListener("input", () => {});

  // ── загрузка файла ──
  $("pick").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    $("fileHint").textContent = f.name;

    if (f.type.startsWith("video")) {
      img = null;
      vid.src = url;
      vid.loop = true;
      vid.play().catch(()=>{});
      vid.onloadedmetadata = () => {
        source = { w: vid.videoWidth || 900, h: vid.videoHeight || 520, isVideo: true };
        $("dlVid").disabled = false;
        $("empty").style.display = "none";
      };
    } else {
      vid.pause(); vid.removeAttribute("src");
      $("dlVid").disabled = true;
      const im = new Image();
      im.onload = () => {
        img = im;
        source = { w: im.naturalWidth, h: im.naturalHeight, isVideo: false };
        $("empty").style.display = "none";
      };
      im.src = url;
    }
  });

  // ── клик по холсту: пауза/продолжить для видео ──
  out.addEventListener("click", () => {
    if (source && source.isVideo) vid.paused ? vid.play() : vid.pause();
  });

  // ── ГЛАВНЫЙ РЕНДЕР ──
  function draw(){
    requestAnimationFrame(draw);
    if (!source) return;

    const s = S();
    const el = source.isVideo ? vid : img;
    if (!el) return;

    // размер выходного холста — как исходник, но не шире 1280
    const k = Math.min(1, 1280 / source.w);
    const W = Math.max(64, Math.round(source.w * k));
    const H = Math.max(64, Math.round(source.h * k));
    if (out.width !== W || out.height !== H) { out.width = W; out.height = H; }

    const cw = s.size * 0.6;                    // ширина одной клетки
    const cols = Math.max(4, Math.floor(W / cw));
    const rows = Math.max(4, Math.floor(H / s.size));
    const cwReal = W / cols, chReal = H / rows;

    // 1. ужимаем кадр до сетки символов
    if (off.width !== cols || off.height !== rows) { off.width = cols; off.height = rows; }
    try { offCtx.drawImage(el, 0, 0, cols, rows); } catch(e){ return; }
    const px = offCtx.getImageData(0, 0, cols, rows).data;

    // 2. глитч: смещения строк
    const shifts = new Int32Array(rows);
    if (s.glitch > 0) {
      for (let y = 0; y < rows; y++) {
        if (Math.random() < (s.glitch / 100) * 0.28) {
          shifts[y] = Math.round((Math.random()*2 - 1) * (s.glitch/100) * cols * 0.4);
        }
      }
      // размазываем сдвиг на соседние строки — так выглядит естественнее
      for (let y = 1; y < rows; y++) if (shifts[y] === 0 && Math.random() < 0.5) shifts[y] = shifts[y-1];
    }

    // 3. фон + шрифт
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.font = `${Math.round(s.size)}px ui-monospace, Consolas, monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";

    const cnt = s.chars.length;
    const pal = palette();
    const bright = s.bright / 100, contrast = 1 + s.contrast / 100;
    const noiseAmt = s.noise / 100;
    grid = [];

    for (let y = 0; y < rows; y++) {
      let line = "";
      for (let x = 0; x < cols; x++) {
        const sx = ((x + (shifts[y] || 0)) % cols + cols) % cols;
        const i = (y * cols + sx) * 4;
        let r = px[i], g = px[i+1], b = px[i+2];

        // яркость и контраст
        let L = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
        L = (L - 0.5) * contrast + 0.5 + bright;

        // шум по яркости
        if (noiseAmt > 0) L += (Math.random()*2 - 1) * noiseAmt * 0.9;
        // инверсия: переворачиваем и яркость, и сам цвет
        if (s.invert) { L = 1 - L; r = 255 - r; g = 255 - g; b = 255 - b; }
        L = L < 0 ? 0 : L > 1 ? 1 : L;

        let ch = s.chars[Math.round(L * (cnt - 1))];

        // шум «портрет текст»: иногда символ подменяется случайным
        if (noiseAmt > 0 && Math.random() < noiseAmt * 0.04) {
          ch = s.chars[(Math.random() * cnt) | 0];
        }
        line += ch;

        if (pal) {
          ctx.fillStyle = mix(pal, L);
          ctx.globalAlpha = 1;
        } else if (s.mode === "src") {
          ctx.fillStyle = `rgb(${r},${g},${b})`;
          ctx.globalAlpha = 1;
        } else {
          ctx.fillStyle = FG;
          ctx.globalAlpha = 1;
        }
        ctx.fillText(ch, x * cwReal + cwReal/2, y * chReal + chReal/2);
      }
      grid.push(line);
    }
    ctx.globalAlpha = 1;

    // 4. помехи поверх
    if (s.inter > 0) {
      const p = s.inter / 100;
      ctx.save();
      ctx.fillStyle = FG;
      ctx.globalAlpha = 0.10 * p;
      const bands = Math.round(p * 7);
      for (let i = 0; i < bands; i++) {
        ctx.fillRect(0, Math.random() * H, W, Math.random() * H * 0.05 + 2);
      }
      ctx.fillStyle = BG;
      ctx.globalAlpha = 0.20 * p;
      for (let yy = 0; yy < H; yy += 3) ctx.fillRect(0, yy, W, 1);
      ctx.restore();
    }
  }
  draw();

  // ── скачивание ──
  function save(blob, name){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  $("dlPng").addEventListener("click", () => {
    if (!source) return;
    out.toBlob(b => save(b, "simvol.png"), "image/png");
  });

  $("dlTxt").addEventListener("click", () => {
    if (!grid.length) return;
    save(new Blob([grid.join("\n")], {type:"text/plain;charset=utf-8"}), "simvol.txt");
  });

  $("dlVid").addEventListener("click", async () => {
    if (!source || !source.isVideo) return;
    const btn = $("dlVid");
    const hint = $("vidHint");

    // webm пишется стабильнее, чем mp4 — ставим его первым
    const mime = ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm","video/mp4"]
      .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    if (!mime) {
      alert("Ваш браузер не умеет записывать видео. Откройте файл в Chrome.");
      return;
    }

    btn.disabled = true;

    // 1) перемотать в начало — с защитой от зависания, если кадр уже на нуле
    const wasLooping = vid.loop;
    vid.loop = false;
    vid.pause();
    if (vid.currentTime > 0.05) {
      await new Promise(res => {
        let done = false;
        const finish = () => { if (!done) { done = true; res(); } };
        vid.onseeked = finish;
        vid.currentTime = 0;
        setTimeout(finish, 700);        // страховка
      });
    }

    // 2) начать запись
    const chunks = [];
    let rec;
    try {
      rec = new MediaRecorder(out.captureStream(30), { mimeType: mime });
    } catch (err) {
      alert("Не удалось начать запись: " + err.message);
      btn.disabled = false;
      return;
    }

    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };

    rec.onstop = () => {
      const ext = mime.includes("mp4") ? "mp4" : "webm";
      if (chunks.length) {
        save(new Blob(chunks, { type: mime }), "ASCII-art." + ext);
        hint.textContent = "готово — файл скачан";
      } else {
        hint.textContent = "не получилось записать, попробуйте ещё раз";
      }
      btn.textContent = "ВИДЕО (без звука)";
      btn.disabled = false;
      vid.loop = wasLooping;
      vid.play().catch(()=>{});
    };

    vid.onended = () => { if (rec.state !== "inactive") rec.stop(); };

    btn.textContent = "ИДЁТ ЗАПИСЬ…";
    rec.start(500);   // отдавать данные порциями — так файл не теряется

    // 3) играем и одновременно считаем время
    try { await vid.play(); } catch (e) {}

    const hasDamage = +$("noise").value > 0 || +$("glitch").value > 0 || +$("inter").value > 0;
    const limit = hasDamage ? 5000 : null;   // с повреждениями — ровно 5 секунд

    const started = performance.now();
    const tick = () => {
      if (rec.state === "inactive") return;
      if (limit && performance.now() - started >= limit) {
        vid.pause();
        rec.stop();
        return;
      }
      const done = !limit && vid.ended;
      if (done) { rec.stop(); return; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });

  syncLabels();
  syncRows();
  syncTheme();
})();
</script>
</body>
</html>
